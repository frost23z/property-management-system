{% load property_tags %}
<form class="search-form {{ css_class }}" method="get" action="{% url 'property_app:property_list' %}">
  <label class="sr-only" for="{{ form.location.id_for_label }}">{{ form.location.label }}</label>
  {{ form.location }}
  {% location_datalist %}
  {% if show_radius %}
    <label class="sr-only" for="{{ form.radius.id_for_label }}">{{ form.radius.label }}</label>
    {{ form.radius }}
  {% endif %}
  <button class="btn search-form__submit" type="submit">Search</button>
</form>
{% for error in form.location.errors %}
  <p class="form-error" role="alert">{{ error }}</p>
{% endfor %}
{% for error in form.radius.errors %}
  <p class="form-error" role="alert">{{ error }}</p>
{% endfor %}
