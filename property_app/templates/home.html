{% extends "base.html" %}
{% load property_tags %}

{% block content %}
<section class="hero">
  <div class="container">
    <h1 class="hero__title">Find your perfect getaway in Bangladesh</h1>
    <p class="hero__subtitle">Beach cottages, hill retreats, tea estate bungalows and more.</p>

    <form class="search-form" method="get" action="{% url 'property_app:property_list' %}">
      <label class="sr-only" for="{{ form.location.id_for_label }}">{{ form.location.label }}</label>
      {{ form.location }}
      {% location_datalist %}
      <button class="btn search-form__submit" type="submit">Search</button>
    </form>
  </div>
</section>
{% endblock %}
